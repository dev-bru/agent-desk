[project]
name = "agent-desk"
version = "0.1.0"
description = "Event-driven multi-agent support desk: Kafka, LangGraph, MCP tools and human approval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.3",
    "litellm==1.106.6",
    "langchain-litellm==0.11.2",
    "fastmcp==4.1.4",
    "pydantic==2.14.2",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "confluent-kafka==2.16.1",
    "tzdata==2026.6",
]

[project.scripts]
agent-desk = "agent_desk.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_desk"]

[tool.pytest.ini_options]
addopts = "-m 'not live and not kafka'"
markers = ["live: needs a model server or a hosted API key (opt-in)", "kafka: needs a running Kafka broker (opt-in)"]
testpaths = ["tests"]
pythonpath = ["src"]
