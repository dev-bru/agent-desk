# Template for the local development broker. scripts/kafka-local.ps1 copies it to .kafka/server.properties
# and replaces @DATA_DIR@ with the data folder (.kafka/data).
#
# KRaft mode: this one process is both the broker and the controller. It keeps its own metadata log.
# No second service is needed. (Kafka 4 has no other mode.)
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9093

# Loopback only: nothing outside this PC can connect. 9092 is the client port, 9093 is the controller port.
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=@DATA_DIR@
num.partitions=1

# One broker, so every internal topic keeps one copy.
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# A new group joins at once (no wait for more members). Good for a one-broker dev setup.
group.initial.rebalance.delay.ms=0

# High retention: Kafka on Windows can fail when it deletes old log files (file locks).
# If it never deletes, it never hits that error. 87600 hours is ten years. The size limit is off (-1).
log.retention.hours=87600
log.retention.bytes=-1
log.segment.bytes=1073741824
log.retention.check.interval.ms=3600000
